services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketingbus
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: marketingbus
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - marketingbus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketingbus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marketingbus-data:
